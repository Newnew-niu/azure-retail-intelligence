# Generated by scripts/build_serving_catalog.py - do not edit by hand.
owner: Data Platform (portfolio project, Newnew-niu)
sql_dialect: DuckDB (the azuresql backend translates it to T-SQL)
reporting_window:
  first_purchase_date_key: 20170101
  last_purchase_date_key: 20180831
  note: The KPIs in the README cover this purchase date range only. The mart views cover all dates, so
    totals summed over a mart view can differ from the README. To reproduce a README KPI, filter dw facts
    on purchase_date_key, or mart.vw_sales_monthly on year_month.
kpi_definitions:
  Sales orders: orders whose status is not 'canceled' or 'unavailable'
  Product sales: SUM(item price) of sales orders - excludes freight; "GMV" in reports
  Freight: SUM(item freight) of sales orders
  AOV: (product sales + freight) / number of sales orders that have items
  Customers: DISTINCT customer_unique_id (customer_id is one per order in Olist)
  Delivery days: purchase -> customer delivery, delivered orders only
  Late rate: delivered orders delivered after the estimated date / delivered orders
  Review score: mean of the per-order average score, orders with a review only
datasets:
  mart.vw_sales_monthly:
    description: Monthly sales KPIs by purchase month. Sales orders only. Use for sales trends.
    grain: one row per month
    layer: mart
    source: sql/mart/01_views.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: year_month
      type: VARCHAR
      definition: Purchase month as text, for example 2018-01
    - name: month_start
      type: DATE
      definition: First day of the purchase month
    - name: sales_orders
      type: INTEGER
      definition: Number of sales orders (status not canceled or unavailable)
    - name: customers
      type: INTEGER
      definition: Distinct people, counted on customer_unique_id
    - name: items_sold
      type: INTEGER
      definition: Number of order items sold
    - name: product_sales
      type: DECIMAL(38,2)
      definition: Sum of item prices in BRL, excluding freight
    - name: freight
      type: DECIMAL(38,2)
      definition: Sum of item freight in BRL
    - name: average_order_value
      type: DECIMAL(12,2)
      definition: (Product sales + freight) / sales orders that have items, in BRL
  mart.vw_delivery_by_state:
    description: Delivery speed, late rate and review score by customer state. Delivered orders only.
    grain: one row per customer state, delivered orders
    layer: mart
    source: sql/mart/01_views.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: customer_state
      type: VARCHAR
      definition: Two-letter state of the customer
    - name: delivered_orders
      type: INTEGER
      definition: Number of delivered orders
    - name: avg_delivery_days
      type: DECIMAL(7,2)
      definition: Mean days from purchase to customer delivery
    - name: avg_estimated_days
      type: DECIMAL(7,2)
      definition: Mean days from purchase to the promised delivery date
    - name: late_rate
      type: DECIMAL(5,4)
      definition: Share of delivered orders delivered after the promised date, from 0 to 1
    - name: avg_review_score
      type: DECIMAL(3,2)
      definition: Mean of the per-order review score, orders with a review only
  mart.vw_review_by_delivery_status:
    description: 'Review score by delivery outcome. Sales orders only. Descriptive: it shows an association,
      not that lateness causes lower scores.'
    grain: one row per delivery status
    layer: mart
    source: sql/mart/01_views.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: delivery_status
      type: VARCHAR
      definition: Delivery outcome (On time, Late, Not delivered)
    - name: orders
      type: INTEGER
      definition: Number of distinct orders
    - name: reviewed_orders
      type: INTEGER
      definition: Number of orders with at least one review
    - name: avg_review_score
      type: DECIMAL(3,2)
      definition: Mean of the per-order review score, orders with a review only
  mart.vw_category_sales:
    description: Sales by product category at item level. Sales orders only. There is no order count because
      one order can contain several categories.
    grain: one row per English category
    layer: mart
    source: sql/mart/01_views.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: category_name_en
      type: VARCHAR
      definition: English category name; the Portuguese name when no translation exists
    - name: is_category_translated
      type: TINYINT
      definition: 1 if the category has an English translation, otherwise 0
    - name: items_sold
      type: INTEGER
      definition: Number of order items sold
    - name: products
      type: INTEGER
      definition: Number of distinct products sold
    - name: product_sales
      type: DECIMAL(38,2)
      definition: Sum of item prices in BRL, excluding freight
    - name: avg_item_price
      type: DECIMAL(10,2)
      definition: Mean item price in BRL
    - name: freight
      type: DECIMAL(38,2)
      definition: Sum of item freight in BRL
  mart.vw_seller_performance:
    description: Sales, delivery time and review score by seller. Sales orders only. Averages are item-weighted.
    grain: one row per seller
    layer: mart
    source: sql/mart/01_views.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: seller_id
      type: VARCHAR
      definition: Seller identifier from the source
    - name: seller_state
      type: VARCHAR
      definition: Two-letter state of the seller
    - name: items_sold
      type: INTEGER
      definition: Number of order items sold
    - name: orders
      type: INTEGER
      definition: Number of distinct orders
    - name: product_sales
      type: DECIMAL(38,2)
      definition: Sum of item prices in BRL, excluding freight
    - name: avg_delivery_days
      type: DECIMAL(7,2)
      definition: Mean days from purchase to customer delivery
    - name: avg_review_score
      type: DECIMAL(3,2)
      definition: Mean of the per-order review score, orders with a review only
  mart.vw_payment_mix:
    description: Payment value by payment type. Sales orders only.
    grain: one row per payment type
    layer: mart
    source: sql/mart/01_views.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: payment_type
      type: VARCHAR
      definition: Payment method (credit_card, boleto, voucher, debit_card, not_defined)
    - name: payment_records
      type: INTEGER
      definition: Number of payment records
    - name: orders
      type: INTEGER
      definition: Number of distinct orders
    - name: payment_value
      type: DECIMAL(38,2)
      definition: Payment amount in BRL
    - name: avg_installments
      type: DECIMAL(5,2)
      definition: Mean number of installments per payment record
  dw.fact_orders:
    description: One row per order with item, payment, review and delivery measures. Use for order counts
      and delivery KPIs. Includes canceled and unavailable orders, so filter on order_status for sales
      KPIs.
    grain: one row per order
    layer: dw
    source: sql/dw/01_tables.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: order_id
      type: VARCHAR
      definition: Primary key
    - name: customer_key
      type: INTEGER
      definition: → dim_customer
    - name: purchase_date_key
      type: INTEGER
      definition: → dim_date (NULL when the event has not happened)
    - name: approved_date_key
      type: INTEGER
      definition: → dim_date (NULL when the event has not happened)
    - name: delivered_carrier_date_key
      type: INTEGER
      definition: → dim_date (NULL when the event has not happened)
    - name: delivered_customer_date_key
      type: INTEGER
      definition: → dim_date (NULL when the event has not happened)
    - name: estimated_delivery_date_key
      type: INTEGER
      definition: → dim_date (NULL when the event has not happened)
    - name: order_status
      type: VARCHAR
      definition: delivered, shipped, canceled, unavailable, invoiced, processing, created, approved
    - name: purchased_at
      type: TIMESTAMP
      definition: Purchase timestamp in Brazilian local time
    - name: delivered_customer_at
      type: TIMESTAMP
      definition: Timestamp of delivery to the customer, NULL if not delivered
    - name: estimated_delivery_date
      type: DATE
      definition: Promised date
    - name: item_count
      type: INTEGER
      definition: From `stg.order_items` grouped by order; 0 for the 775 orders without items
    - name: items_price
      type: DECIMAL(12,2)
      definition: From `stg.order_items` grouped by order; 0 for the 775 orders without items
    - name: items_freight
      type: DECIMAL(12,2)
      definition: From `stg.order_items` grouped by order; 0 for the 775 orders without items
    - name: payment_count
      type: INTEGER
      definition: From `stg.order_payments` grouped by order; 0 for the 1 order without payment
    - name: payment_value
      type: DECIMAL(12,2)
      definition: From `stg.order_payments` grouped by order; 0 for the 1 order without payment
    - name: review_count
      type: INTEGER
      definition: From `stg.order_reviews`; NULL score for the 768 orders without a review
    - name: review_score_avg
      type: DECIMAL(3,2)
      definition: From `stg.order_reviews`; NULL score for the 768 orders without a review
    - name: delivery_days
      type: DECIMAL(7,2)
      definition: Purchase → delivered, in days (delivered orders only)
    - name: estimated_delivery_days
      type: INTEGER
      definition: Purchase date → promised date
    - name: delivery_vs_estimate_days
      type: INTEGER
      definition: Delivered date − promised date; > 0 means late
    - name: is_delivered
      type: TINYINT
      definition: Status `delivered` and a delivery timestamp
    - name: is_late
      type: TINYINT
      definition: NULL when not delivered
    - name: delivery_status
      type: VARCHAR
      definition: '`On time`, `Late`, `Not delivered`'
  dw.fact_order_items:
    description: 'One row per order item. Use for product, category and seller analysis. Never join it
      to fact_payments directly: both are many-per-order and totals would be double counted.'
    grain: one row per order item
    layer: dw
    source: sql/dw/01_tables.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: order_id
      type: VARCHAR
      definition: Order identifier from the source
    - name: order_item_id
      type: INTEGER
      definition: Position of the item within its order
    - name: product_key
      type: INTEGER
      definition: Foreign key to dw.dim_product
    - name: seller_key
      type: INTEGER
      definition: Foreign key to dw.dim_seller
    - name: customer_key
      type: INTEGER
      definition: Foreign key to dw.dim_customer
    - name: purchase_date_key
      type: INTEGER
      definition: Purchase date as yyyymmdd, foreign key to dw.dim_date
    - name: shipping_limit_date_key
      type: INTEGER
      definition: Seller shipping deadline as yyyymmdd, foreign key to dw.dim_date
    - name: order_status
      type: VARCHAR
      definition: Order status, copied from the order so that rows can be filtered without a join
    - name: price
      type: DECIMAL(10,2)
      definition: Item price in BRL, excluding freight
    - name: freight_value
      type: DECIMAL(10,2)
      definition: Item freight in BRL
  dw.fact_payments:
    description: 'One row per payment record. Use for payment analysis. Never join it to fact_order_items
      directly: both are many-per-order and totals would be double counted.'
    grain: one row per payment record
    layer: dw
    source: sql/dw/01_tables.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: order_id
      type: VARCHAR
      definition: Order identifier from the source
    - name: payment_sequential
      type: INTEGER
      definition: Position of the payment record within its order
    - name: customer_key
      type: INTEGER
      definition: Foreign key to dw.dim_customer
    - name: purchase_date_key
      type: INTEGER
      definition: Purchase date as yyyymmdd, foreign key to dw.dim_date
    - name: order_status
      type: VARCHAR
      definition: Order status, copied from the order so that rows can be filtered without a join
    - name: payment_type
      type: VARCHAR
      definition: Payment method (credit_card, boleto, voucher, debit_card, not_defined)
    - name: payment_installments
      type: INTEGER
      definition: Number of installments of this payment record
    - name: payment_value
      type: DECIMAL(10,2)
      definition: Payment amount in BRL
  dw.dim_customer:
    description: One row per customer_id, which Olist issues per order. Count DISTINCT customer_unique_id
      for people.
    grain: one row per customer_id (= one per order in Olist)
    layer: dw
    source: sql/dw/01_tables.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: customer_key
      type: INTEGER
      definition: Surrogate key; `-1` = Unknown
    - name: customer_id
      type: VARCHAR
      definition: Source key, one per order
    - name: customer_unique_id
      type: VARCHAR
      definition: The person; count this for "customers"
    - name: zip_code_prefix
      type: VARCHAR
      definition: Delivery address of that order
    - name: city
      type: VARCHAR
      definition: Delivery address of that order
    - name: state
      type: VARCHAR
      definition: Delivery address of that order
    - name: latitude
      type: DECIMAL(9,6)
      definition: Zip-prefix centroid; NULL for 279 customers whose prefix has no geolocation
    - name: longitude
      type: DECIMAL(9,6)
      definition: Zip-prefix centroid; NULL for 279 customers whose prefix has no geolocation
  dw.dim_product:
    description: Product attributes and category names. Key -1 is the Unknown member.
    grain: one row per product
    layer: dw
    source: sql/dw/01_tables.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: product_key
      type: INTEGER
      definition: Surrogate key; `-1` = Unknown
    - name: product_id
      type: VARCHAR
      definition: Source key
    - name: category_name_pt
      type: VARCHAR
      definition: Portuguese category; `sem_categoria` when missing
    - name: category_name_en
      type: VARCHAR
      definition: English category; `uncategorised` when missing; Portuguese name when no translation
        exists
    - name: is_category_translated
      type: TINYINT
      definition: 0 for the 13 products in `pc_gamer` and `portateis_cozinha_e_preparadores_de_alimentos`
    - name: name_length
      type: INTEGER
      definition: As in the source
    - name: description_length
      type: INTEGER
      definition: As in the source
    - name: photos_qty
      type: INTEGER
      definition: As in the source
    - name: weight_g
      type: INTEGER
      definition: As in the source
    - name: length_cm
      type: INTEGER
      definition: As in the source
    - name: height_cm
      type: INTEGER
      definition: As in the source
    - name: width_cm
      type: INTEGER
      definition: As in the source
  dw.dim_seller:
    description: Seller location. Key -1 is the Unknown member.
    grain: one row per seller
    layer: dw
    source: sql/dw/01_tables.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: seller_key
      type: INTEGER
      definition: Surrogate key; `-1` = Unknown
    - name: seller_id
      type: VARCHAR
      definition: Source key
    - name: zip_code_prefix
      type: VARCHAR
      definition: As for customers; 7 sellers without geolocation
    - name: city
      type: VARCHAR
      definition: As for customers; 7 sellers without geolocation
    - name: state
      type: VARCHAR
      definition: As for customers; 7 sellers without geolocation
    - name: latitude
      type: DECIMAL(9,6)
      definition: As for customers; 7 sellers without geolocation
    - name: longitude
      type: DECIMAL(9,6)
      definition: As for customers; 7 sellers without geolocation
  dw.dim_date:
    description: Calendar table. Join on date_key, which is an integer in yyyymmdd format.
    grain: one row per calendar day, 2016-01-01 to 2020-12-31
    layer: dw
    source: sql/dw/01_tables.sql
    owner: Data Platform (portfolio project, Newnew-niu)
    columns:
    - name: date_key
      type: INTEGER
      definition: yyyymmdd, primary key
    - name: date
      type: DATE
      definition: Calendar date
    - name: year
      type: SMALLINT
      definition: Calendar year
    - name: quarter
      type: TINYINT
      definition: Calendar quarter, 1 to 4
    - name: month
      type: TINYINT
      definition: Calendar month, 1 to 12
    - name: month_name
      type: VARCHAR
      definition: English, independent of session language
    - name: year_month
      type: VARCHAR
      definition: '`2018-01`; sorts correctly as text'
    - name: month_start
      type: DATE
      definition: First day of the month
    - name: day_of_month
      type: TINYINT
      definition: Day of the month, 1 to 31
    - name: day_of_week
      type: TINYINT
      definition: 1 = Monday … 7 = Sunday
    - name: day_name
      type: VARCHAR
      definition: English, independent of session language
    - name: is_weekend
      type: TINYINT
      definition: Saturday or Sunday
