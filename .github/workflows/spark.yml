# Tests the PySpark lakehouse track on tiny hand-made fixtures: no real data, no secrets,
# no cloud resources. The parity test skips here because the licensed data is not committed.
name: Spark tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-spark.txt
      - name: Cache the Delta Lake jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('requirements-spark.txt') }}
      - run: pip install -r requirements-spark.txt
      # --confcutdir keeps the SQL Server conftest (pyodbc) out of this run
      - run: python -m pytest tests/spark --confcutdir=tests/spark
