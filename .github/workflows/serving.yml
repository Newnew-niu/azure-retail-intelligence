# Runs the serving layer tests on a tiny synthetic database: no real data, secrets or network.
name: Serving tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r serving/requirements-test.txt
      - run: python -m pytest serving/tests
