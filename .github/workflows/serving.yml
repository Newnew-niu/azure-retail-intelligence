# Tests the serving layer on a tiny synthetic database: no real data, secrets or network calls
# beyond installing packages and pulling the Python base image.
name: Serving tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r serving/requirements-test.txt
      - run: python -m pytest serving/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r serving/requirements-test.txt
      - run: bash serving/tests/docker_smoke.sh
